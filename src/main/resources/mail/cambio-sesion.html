<!doctype html>
<html lang="es">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
  <body style="margin:0;background:#f4f7fb;font-family:Arial,sans-serif;color:#15324b">
    <div style="max-width:600px;margin:32px auto;background:#fff;border:1px solid #dce4ec;border-radius:12px;overflow:hidden">
      <div style="padding:24px 30px;background:#103860;color:#fff;font-size:20px;font-weight:700">Escuela Jurídica</div>
      <div style="padding:28px 30px">
        <h1 style="font-size:22px;margin:0 0 16px">Cambio en tu sesión en vivo</h1>
        <p>Hola, hubo un cambio en la siguiente sesión:</p>
        <div style="padding:16px;background:#f7fafc;border-radius:8px;margin:20px 0">
          <p style="margin:4px 0"><strong>Sesión:</strong> {{sesion}}</p>
          <p style="margin:4px 0"><strong>Nuevo horario:</strong> {{inicio}}</p>
          <p style="margin:4px 0"><strong>Motivo:</strong> {{motivo}}</p>
        </div>
        <p>Podrás consultar el detalle actualizado desde el aula virtual.</p>
        <p style="font-size:12px;color:#667085;margin-top:28px">Este mensaje fue generado automáticamente por Escuela Jurídica.</p>
      </div>
    </div>
  </body>
</html>
