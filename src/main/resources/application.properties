spring.application.name=escuela-juridica-api
spring.profiles.active=local

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jackson.time-zone=America/Lima

spring.mail.host=mail.aulavirtual.escuelajuridica.edu.pe
spring.mail.port=465
spring.mail.username=notificaciones@aulavirtual.escuelajuridica.edu.pe
spring.mail.password=TW5#!klJwXeNFBV4
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

server.port=8080
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# CSRF: Swagger UI repite la cookie XSRF-TOKEN en la cabecera X-XSRF-TOKEN al probar peticiones que modifican datos.
springdoc.swagger-ui.csrf.enabled=true

application.time-zone=America/Lima
application.frontend-base-url=http://localhost:4200

# HU-011: carpeta donde se guardan los materiales subidos (archivo local). Relativa al directorio
# de ejecución salvo que se dé una ruta absoluta.
esejur.almacenamiento.directorio=uploads
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB

cors.allowed-origin=http://localhost:4200

security.jwt.issuer=esejur-api
security.jwt.secret=fb20369f2bac1a9414d1d113704e79f563df13e82209142d05ecb28a2e22aed0238a9ec44c7a5d55f43fb09e532d4b46
security.jwt.expiration-minutes=60
security.jwt.verificacion-secret=416185a5efa01f83cced8cf4e0e2322e8300ee22e228c820851aaaef8a4158c3de3431caf43d0af8ce20631b9e45c6c8
security.cookie.name=ESEJUR_SESION
security.cookie.secure=false
security.cookie.same-site=Lax
# CSRF (cookie XSRF-TOKEN legible por Angular + cabecera X-XSRF-TOKEN). Usa los mismos secure y same-site de la sesion.
# Dominio de la cookie: dejarlo vacio mientras frontend y backend sean el mismo host (localhost); si en produccion
# viven en subdominios distintos (app.dominio.pe / api.dominio.pe), poner el dominio comun (dominio.pe) para que
# Angular pueda leerla.
security.csrf.cookie-domain=

# HU-047 - Culqi. SIMULADO (local, para desarrollo y demostracion) o REAL (api.culqi.com).
# En REAL son obligatorias las llaves del panel de Culqi (integracion: pk_test_/sk_test_; produccion: pk_live_/sk_live_).
esejur.culqi.modo=SIMULADO
esejur.culqi.api-url=https://api.culqi.com/v2
esejur.culqi.llave-publica=
esejur.culqi.llave-privada=
esejur.culqi.orden-vigencia-horas=24
# Autenticacion basica del webhook ("Activar autenticacion" en CulqiPanel). Vacio = sin autenticacion.
esejur.culqi.webhook-usuario=
esejur.culqi.webhook-clave=

# HU-039 - Correo de la Escuela que recibe el aviso de cada queja o reclamo.
esejur.reclamaciones.correo-escuela=informes@esejur.pe
# Feriados oficiales extraordinarios del ano (fechas ISO separadas por comas); los fijos y Semana Santa se calculan solos.
esejur.feriados-adicionales=
