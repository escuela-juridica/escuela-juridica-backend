spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

logging.level.root=WARN
logging.level.pe.edu.utp.escuela.app=INFO

spring.mail.password=${MAIL_PASSWORD}
security.jwt.secret=${JWT_SECRET}
security.jwt.verificacion-secret=${JWT_VERIFICATION_SECRET}
security.cookie.secure=true
application.frontend-base-url=${FRONTEND_BASE_URL}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
server.address=127.0.0.1
esejur.almacenamiento.directorio=${FILES_DIR}
security.csrf.cookie-domain=${CSRF_COOKIE_DOMAIN}
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.mail.host=mail.aulavirtual.escuelajuridica.edu.pe
spring.mail.port=465
spring.mail.username=notificaciones@aulavirtual.escuelajuridica.edu.pe
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1GB
security.jwt.issuer=esejur-api
security.jwt.expiration-minutes=60
security.cookie.name=ESEJUR_SESION
security.cookie.same-site=Lax
esejur.culqi.api-url=https://api.culqi.com/v2
esejur.culqi.order-validity-hours=24
esejur.reclamaciones.correo-escuela=informes@esejur.pe
esejur.feriados-adicionales=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

esejur.culqi.public-key=${ESEJUR_CULQI_PUBLIC_KEY}
esejur.culqi.private-key=${ESEJUR_CULQI_PRIVATE_KEY}
esejur.culqi.webhook-user=${ESEJUR_CULQI_WEBHOOK_USER}
esejur.culqi.webhook-password=${ESEJUR_CULQI_WEBHOOK_PASSWORD}
