name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y probar
        run: ./mvnw -B clean package

      - name: Nombre de la imagen (en minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/esejurce-backend" >> "$GITHUB_ENV"

      - name: Entrar a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Preparar SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -T 15 "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Desplegar en el VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          SSH="ssh -p $VPS_PORT -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes $VPS_USER@$VPS_HOST"

          printf '%s' "$GHCR_TOKEN" | $SSH "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          $SSH "bash -s -- '$IMAGE'" <<'REMOTO'
          set -euo pipefail
          IMAGE="$1"

          docker pull "$IMAGE:latest"
          docker stop esejurce 2>/dev/null || true
          docker rm esejurce 2>/dev/null || true

          docker run -d \
            --name esejurce \
            --restart unless-stopped \
            --network host \
            --env-file /etc/esejurce/app.env \
            -v /opt/esejurce/files:/opt/esejurce/files \
            "$IMAGE:latest"

          for intento in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              echo "Backend arriba tras $((intento * 3)) s"
              docker image prune -f > /dev/null
              docker logout ghcr.io > /dev/null
              exit 0
            fi
            sleep 3
          done

          echo "El backend no respondió en 2 minutos. Últimas líneas del log:"
          docker logs --tail 80 esejurce
          docker logout ghcr.io > /dev/null
          exit 1
          REMOTO
